name: MediaCoder
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: '14.0'
targets:
  MediaCoder:
    type: application
    platform: macOS
    sources: [Sources/MediaCoder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.MediaCoder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_CFBundleDisplayName: Media Coder
        SWIFT_VERSION: '5.0'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Configuration/MediaCoder.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
    postBuildScripts:
      - name: Embed and sign bundled transcoding engine
        script: '"$SRCROOT/scripts/embed-engine.sh"'
        basedOnDependencyAnalysis: false
